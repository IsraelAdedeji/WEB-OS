<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div>
        <div id="top"
            style="position: absolute; width: 100%; display: flex; backdrop-filter: blur(10px); background-color: rgba(0, 0, 0, 0.125); color: #fff; justify-content: space-between; gap: 32px;">
            <p style="margin-left: 16px; font-weight: 700; font-size: 20px; cursor:pointer" id="welcomeOpen">
                <u>SpaceOS</u>
            </p>
            <p
                style="margin-left: 70px; background-color: rgba(256, 256, 256, 0.25); padding: 4px 12px; border-radius: 16px; color: aquamarine; text-align: center; font-size: 20px;">
                Explore the vast regions of outer space
            </p>
            <p id="timeElement" style="color: white; padding: 4px 12px; border-radius: 16px;">
                Time
            </p>
        </div>

        <div id="welcome" class="window">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div id="welcomeheader" class="dragImage">
                    <img src="images/blklogo-removebg-preview.png" alt="" height="40px">
                </div>
                <div class="closeButton" id="welcomeClose">🚀 Close</div>
            </div>
            <h1 class="headerText">Space OS</h1>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTiu8n1f5DFu9PPgqTZf72IgjH-w0YxWioKswOnlNnEFg&s=10"
                alt="galaxy" style="width: 100%; height: auto; border-radius: 12px;">
        </div>

        <div id="desktopApps" style="padding-top: 64px; padding-left: 16px;">

            <div class="selected" id="goldenRecordOpen"
                style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content; cursor: pointer;">
                <img src="images/vgr-removebg-preview.png" style="width: 64px; height: 64px;">
                <p style="margin: 0px; color: #fff">Golden Record</p>
            </div>

            <div id="solarOpen" class="selected"
                style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content; cursor: pointer;">
                <img src="images/imgi_157_52-mission-past-Cassini_0.height-700-removebg-preview.png"
                    style="width: 120px; height: 120px;">
                <p style="margin: 0px; color: #fff;">Planet Index</p>
            </div>

            <div id="calcOpen" class="selected"
                style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content; cursor: pointer;">
                <img src="images/imgi_156_2048x1536-UpQuantVal-iStock-ITWM-removebg-preview.png" alt="" height="84px"
                    width="74px">
                <p style="margin: 0px; color: #fff;">Quantum Calc</p>
            </div>

            <div id="browserOpen" class="selected"
                style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content; cursor: pointer;">
                <img src="images/imgi_207_file-20220801-62374-uyna4z-removebg-preview.png" alt="" height="104px"
                    width="94px">
                <p style="margin: 0px; color: #fff;">Warp Web</p>
            </div>
        </div>
    </div>

    <div id="goldenRecord" class="window" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div id="goldenRecordheader" class="dragImage">
                <img src="images/blklogo-removebg-preview.png" alt="" height="40px">
            </div>
            <div class="closeButton" id="goldenRecordClose">🚀 Close</div>
        </div>
        <h1 class="headerText">Golden Record</h1>

        <div
            style="background-color: #fff; margin: 0px; border-radius: 12px; flex: 1; padding: 10px; font-family: Courier; display: flex; flex-direction: row; min-height: 0; gap: 10px;">
            <div id="sidebar"
                style="background-color: #f9f9f9; width: 35%; padding: 5px; border-radius: 16px; box-sizing:border-box; overflow-y: auto;">
            </div>

            <div id="notesContent" style="flex: 1; overflow-y: auto; padding: 5px;">

            </div>
        </div>
    </div>

    <div id="solar" class="window" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div id="solarheader" class="dragImage">
                <img src="images/blklogo-removebg-preview.png" alt="" height="40px">
            </div>
            <div class="closeButton" id="solarClose">🚀 Close</div>
        </div>
        <h1 class="headerText">Planet Index</h1>

        <div
            style="background-color: #fff; margin: 0px; border-radius: 12px; flex: 1; padding: 10px; font-family: Courier; display: flex; flex-direction: row; min-height: 0; gap: 10px;">


            <div id="planetSidebar"
                style="background-color: #f9f9f9; width: 35%; padding: 5px; border-radius: 16px; box-sizing: border-box; overflow-y: auto;">

            </div>

            <div id="planetContent" style="flex: 1; overflow-y: auto; padding: 5px; color: #333;">

            </div>

        </div>
    </div>

    <div id="calc" class="window" style="display: none;">
        <div
            style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px;">
            <div id="calcheader" class="dragImage">
                <img src="images/blklogo-removebg-preview.png" alt="" height="40px">
            </div>
            <div class="closeButton" id="calcClose">🚀 Close</div>
        </div>

        <input type="text" id="calcScreen" disabled
            style="width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 10px; border-radius: 10px; border: 2px solid #ccc; background: #fff; padding: 5px; box-sizing: border-box;">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
            <button class="calc-btn" onclick="calcClear()"
                style="grid-column: span 3; background: #ff4d4d; color: white;">C</button>
            <button class="calc-btn" onclick="calcInput('/')">/</button>
            <button class="calc-btn" onclick="calcInput('7')">7</button>
            <button class="calc-btn" onclick="calcInput('8')">8</button>
            <button class="calc-btn" onclick="calcInput('9')">9</button>
            <button class="calc-btn" onclick="calcInput('*')">*</button>
            <button class="calc-btn" onclick="calcInput('4')">4</button>
            <button class="calc-btn" onclick="calcInput('5')">5</button>
            <button class="calc-btn" onclick="calcInput('6')">6</button>
            <button class="calc-btn" onclick="calcInput('-')">-</button>
            <button class="calc-btn" onclick="calcInput('1')">1</button>
            <button class="calc-btn" onclick="calcInput('2')">2</button>
            <button class="calc-btn" onclick="calcInput('3')">3</button>
            <button class="calc-btn" onclick="calcInput('+')">+</button>
            <button class="calc-btn" onclick="calcInput('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="calcInput('.')">.</button>
            <button class="calc-btn" onclick="calcCalculate()" style="background: #8a2be2; color: white;">=</button>
        </div>
    </div>

    <div id="browser" class="window" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div id="browserheader" class="dragImage">
                <img src="images/blklogo-removebg-preview.png" alt="" height="40px">
            </div>
            <div class="closeButton" id="browserClose">🚀 Close</div>
        </div>
        <h1 class="headerText">Warp Web</h1>

        <div
            style="background-color: #fff; margin: 0px; border-radius: 12px; flex: 1; padding: 15px; display: flex; flex-direction: column; min-height: 0;">
            <p style="font-family: cursive; text-align: center; margin-bottom: 20px;">Search anything and get instantly
                warped to its location on the web.</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="searchInput" placeholder="Search the galaxy..."
                    style="flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #ccc; font-family: cursive;">
                <button onclick="launchSearch()"
                    style="padding: 10px 20px; border-radius: 10px; border: none; background: #8a2be2; color: white; font-weight: bold; cursor: pointer;">Search</button>
            </div>
        </div>
    </div>

    <script src="script.js">
    </script>

</body>

</html>
